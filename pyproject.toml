[project]
name = "erpnext_debug"
authors = [{ name = "Animus Digital" }]
description = "On-screen hook and server script tracer for Frappe / ERPNext developers. Staging and local benches only."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
